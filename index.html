<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>41popzic.github.io</title>

    <style type="text/css">
        .checkerboard-linear {
          margin: 12px;
          align-items: center;
          width: calc(100% - 24px);
          height: 30em;
          background-color: #222423;
          background-image: 
            linear-gradient(45deg, #222020 25%, transparent 25%, transparent 75%, #222020 75%),
            linear-gradient(45deg, #222020 25%, transparent 25%, transparent 75%, #222020 75%);
          background-size: 48px 48px;
          background-position: 0 0, 24px 24px;
          animation: moveSquares 4s steps(16) infinite;
        }

        @keyframes moveSquares {
          from {
            background-position: 0 0, 24px 24px;
          }
          to {
            background-position: 48px 48px, 72px 72px; 
          }
        }

        html {
            background: rgb(33, 33, 33);
            overflow-x: hidden;
            font-size: large;
            font-family: 'B612', sans-serif;
            line-height: 1.3;
            color: rgb(210, 148, 47);
            
        }

        li, details {
            margin-left: 3vw;
            margin-right: 3vw;
            margin-bottom: 0;
        }

       h1 {
            font-size: 1.7rem;
            text-align: center;
			      align-items: center;
            align-content: center;
            margin-top: 0.5em;
            margin-bottom: 0.5em;
            padding: 5px 0;
            -webkit-text-stroke-width: 0;
            background-color: #3d3c3c49;

        }

        h2, summary {
            font-size: 1.3rem;
			      font-weight: bold;
            margin-top: 0.3em;
            margin-bottom: 0.3em;
            -webkit-text-stroke-width: 0;
        }
		

        h3 {
            font-size: 1.2rem;
            margin-top: 0.5em;
            margin-bottom: 0.5em;
            -webkit-text-stroke-width: 0;
        }

        a {
            color: var(--link-accent, #98f);
        }

        table {
            border-collapse: collapse;
            margin: 20px;
            align-self: center;
            justify-content: center;
        }

        tr, tbody, thead {
            margin: 0;
            padding: 0
        }

        th {
            border-width:2px; 
            border-style: solid;
            margin: 0;
            padding: 10px;
        }

        /* wide screen */
        @media (min-width: 711px) {
            html {
                width: 100%;
            }

            body {
                width: 100%;
            }
        }

        /* narrow screen */
        @media (max-width: 710px) {
            body {
                width: 100%;
            }

            p {
                margin: 1em 0.5em;
            }
        }
    </style>
  </head>
  <body>
    <div class="checkerboard-linear">

    <h1 style="margin: 0 20em; border-radius:4px">41popzic</h1>

    <br>
    <details>
      <summary>Who is 41popzic?</summary>
      <li>Hello, I'm 41popzic. You may best know may know me for my BeepBox modification 41Box, my music on SoundCloud, or anything else!</li>
    </details>

    <h2 style="margin-top: 5em;">Please keep in mind this site is a W.I.P.</h2>
    </div>
  </body>
</html>
